<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blue & Gray CV Maker</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{
background:#f2f4f8;
font-family: Arial, sans-serif;
}

.form-section{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

.cv-wrapper{
width:210mm;
min-height:297mm;
background:white;
display:flex;
box-shadow:0 10px 30px rgba(0,0,0,0.2);
margin:auto;
}

.sidebar{
width:35%;
background:#2f3e46;
color:white;
padding:30px;
}

.sidebar h5{
border-bottom:1px solid #aaa;
padding-bottom:5px;
margin-top:20px;
font-size:14px;
text-transform:uppercase;
}

.main{
width:65%;
padding:40px;
}

.name{
font-size:28px;
font-weight:bold;
}

.title{
color:#3b82f6;
font-weight:600;
margin-bottom:20px;
}

.section-title{
font-weight:bold;
border-bottom:2px solid #3b82f6;
padding-bottom:5px;
margin-top:20px;
}

.skill{
font-size:13px;
margin-bottom:5px;
}

@media print {
body * {
visibility:hidden;
}
.cv-wrapper, .cv-wrapper * {
visibility:visible;
}
.cv-wrapper{
position:absolute;
left:0;
top:0;
}
}
</style>
</head>

<body>

<div class="container py-4">
<div class="row g-4">

<!-- FORM -->
<div class="col-lg-4">
<div class="form-section">

<h5>Personal Info</h5>
<input id="name" class="form-control mb-2" placeholder="Full Name">
<input id="title" class="form-control mb-2" placeholder="Job Title">
<input id="phone" class="form-control mb-2" placeholder="Phone">
<input id="email" class="form-control mb-2" placeholder="Email">
<input id="address" class="form-control mb-3" placeholder="Address">

<h5>Profile</h5>
<textarea id="profile" class="form-control mb-3"></textarea>

<h5>Skills (comma separated)</h5>
<input id="skills" class="form-control mb-3">

<h5>Languages (comma separated)</h5>
<input id="languages" class="form-control mb-3">

<h5>Education</h5>
<textarea id="education" class="form-control mb-3" placeholder="Degree - University - Year"></textarea>

<h5>Work Experience</h5>
<textarea id="experience" class="form-control mb-3" placeholder="Role - Company - Year"></textarea>

<button class="btn btn-primary w-100 mb-2" onclick="downloadPDF()">Download PDF</button>

</div>
</div>

<!-- PREVIEW -->
<div class="col-lg-8">
<div id="cv" class="cv-wrapper">

<!-- SIDEBAR -->
<div class="sidebar">
<h5>Contact</h5>
<p id="p-phone"></p>
<p id="p-email"></p>
<p id="p-address"></p>

<h5>Skills</h5>
<div id="p-skills"></div>

<h5>Languages</h5>
<div id="p-languages"></div>
</div>

<!-- MAIN -->
<div class="main">
<div class="name" id="p-name">Your Name</div>
<div class="title" id="p-title">Your Title</div>

<div class="section-title">Profile</div>
<p id="p-profile"></p>

<div class="section-title">Work Experience</div>
<p id="p-experience"></p>

<div class="section-title">Education</div>
<p id="p-education"></p>

</div>

</div>
</div>

</div>
</div>

<script>

document.querySelectorAll("input, textarea").forEach(el=>{
el.addEventListener("input",updateCV);
});

function updateCV(){

p-name.innerText=name.value;
p-title.innerText=title.value;
p-phone.innerText=phone.value;
p-email.innerText=email.value;
p-address.innerText=address.value;
p-profile.innerText=profile.value;
p-experience.innerText=experience.value;
p-education.innerText=education.value;

p-skills.innerHTML="";
skills.value.split(",").forEach(s=>{
if(s.trim())
p-skills.innerHTML+=`<div class="skill">• ${s}</div>`;
});

p-languages.innerHTML="";
languages.value.split(",").forEach(l=>{
if(l.trim())
p-languages.innerHTML+=`<div class="skill">• ${l}</div>`;
});

}

async function downloadPDF(){

const element=document.getElementById("cv");
const canvas=await html2canvas(element,{scale:2});
const imgData=canvas.toDataURL("image/png");

const {jsPDF}=window.jspdf;
const pdf=new jsPDF("p","mm","a4");

const imgWidth=210;
const imgHeight=canvas.height*imgWidth/canvas.width;

pdf.addImage(imgData,"PNG",0,0,imgWidth,imgHeight);
pdf.save("Professional_CV.pdf");

}

</script>

</body>
</html>

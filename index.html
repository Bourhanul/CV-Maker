<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Professional Blue & Gray CV</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

body{
background:#e9edf2;
font-family:'Montserrat',sans-serif;
}

/* ====== A4 SIZE ====== */
.cv-container{
width:210mm;
min-height:297mm;
margin:auto;
display:flex;
background:white;
box-shadow:0 20px 50px rgba(0,0,0,0.15);
}

/* ===== LEFT SIDEBAR ===== */
.sidebar{
width:35%;
background:#2E3A3F;
color:white;
padding:45px 30px;
}

.sidebar h4{
font-size:12px;
text-transform:uppercase;
letter-spacing:1px;
margin-top:30px;
padding-bottom:6px;
border-bottom:1px solid rgba(255,255,255,0.4);
}

.sidebar p{
font-size:12px;
margin:5px 0;
line-height:1.5;
}

/* ===== RIGHT CONTENT ===== */
.main{
width:65%;
padding:60px 50px;
}

.name{
font-size:32px;
font-weight:700;
letter-spacing:2px;
}

.job{
font-size:14px;
color:#3b82f6;
font-weight:600;
margin-top:5px;
margin-bottom:35px;
}

.section-title{
font-size:13px;
font-weight:700;
text-transform:uppercase;
letter-spacing:1px;
margin-top:30px;
margin-bottom:12px;
border-bottom:2px solid #3b82f6;
padding-bottom:6px;
}

.profile{
font-size:12px;
line-height:1.7;
color:#333;
}

.item{
margin-bottom:20px;
}

.flex-row{
display:flex;
align-items:flex-start;
}

.year{
width:90px;
font-size:12px;
font-weight:700;
color:#000;
}

.desc{
flex:1;
font-size:12px;
line-height:1.6;
color:#333;
}

.form-panel{
position:fixed;
left:20px;
top:20px;
width:280px;
background:white;
padding:20px;
box-shadow:0 10px 30px rgba(0,0,0,0.15);
border-radius:10px;
max-height:95vh;
overflow:auto;
}

input, textarea{
width:100%;
margin-bottom:8px;
padding:6px;
font-size:12px;
}

button{
width:100%;
padding:8px;
margin-top:10px;
background:#3b82f6;
color:white;
border:none;
cursor:pointer;
}

button:hover{
background:#2563eb;
}

</style>
</head>

<body>

<div class="form-panel">

<h4>Fill CV</h4>

<input id="name" placeholder="Full Name">
<input id="job" placeholder="Job Title">
<input id="phone" placeholder="Phone">
<input id="email" placeholder="Email">
<input id="address" placeholder="Address">

<textarea id="profile" placeholder="Profile"></textarea>

<textarea id="experience" placeholder="Year - Role & Company - Description (each line new)"></textarea>

<textarea id="education" placeholder="Year - Degree - University"></textarea>

<input id="skills" placeholder="Skills (comma separated)">
<input id="languages" placeholder="Languages (comma separated)">
<input id="reference" placeholder="Reference">

<button onclick="downloadPDF()">Download PDF</button>

</div>


<div id="cv" class="cv-container">

<!-- LEFT -->
<div class="sidebar">

<h4>Contact</h4>
<p id="p-phone"></p>
<p id="p-email"></p>
<p id="p-address"></p>

<h4>Skills</h4>
<div id="p-skills"></div>

<h4>Languages</h4>
<div id="p-languages"></div>

<h4>Reference</h4>
<p id="p-reference"></p>

</div>

<!-- RIGHT -->
<div class="main">

<div class="name" id="p-name">YOUR NAME</div>
<div class="job" id="p-job">JOB TITLE</div>

<div class="section-title">Profile</div>
<div class="profile" id="p-profile"></div>

<div class="section-title">Work Experience</div>
<div id="p-experience"></div>

<div class="section-title">Education</div>
<div id="p-education"></div>

</div>

</div>

<script>

document.querySelectorAll("input, textarea").forEach(el=>{
el.addEventListener("input",updateCV);
});

function updateCV(){

p-name.innerText=name.value.toUpperCase();
p-job.innerText=job.value;
p-phone.innerText=phone.value;
p-email.innerText=email.value;
p-address.innerText=address.value;
p-profile.innerText=profile.value;
p-reference.innerText=reference.value;

p-skills.innerHTML="";
skills.value.split(",").forEach(s=>{
if(s.trim())
p-skills.innerHTML+=`<p>• ${s.trim()}</p>`;
});

p-languages.innerHTML="";
languages.value.split(",").forEach(l=>{
if(l.trim())
p-languages.innerHTML+=`<p>• ${l.trim()}</p>`;
});

p-experience.innerHTML="";
experience.value.split("\n").forEach(line=>{
if(line.trim()){
let parts=line.split("-");
p-experience.innerHTML+=`
<div class="item">
<div class="flex-row">
<div class="year">${parts[0]}</div>
<div class="desc">${line.substring(line.indexOf("-")+1)}</div>
</div>
</div>`;
}
});

p-education.innerHTML="";
education.value.split("\n").forEach(line=>{
if(line.trim()){
let parts=line.split("-");
p-education.innerHTML+=`
<div class="item">
<div class="flex-row">
<div class="year">${parts[0]}</div>
<div class="desc">${line.substring(line.indexOf("-")+1)}</div>
</div>
</div>`;
}
});

}

async function downloadPDF(){
const element=document.getElementById("cv");
const canvas=await html2canvas(element,{scale:3});
const imgData=canvas.toDataURL("image/png");
const {jsPDF}=window.jspdf;
const pdf=new jsPDF("p","mm","a4");
const imgWidth=210;
const imgHeight=canvas.height*imgWidth/canvas.width;
pdf.addImage(imgData,"PNG",0,0,imgWidth,imgHeight);
pdf.save("Professional_Blue_Gray_CV.pdf");
}

</script>

</body>
</html>
